services:
  db:
    image: postgres:18.3
    container_name: db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: blind_battle
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql
      - ./scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d dbdev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8-m03-trixie
    container_name: redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_dev_data:
  redis_dev_data:
