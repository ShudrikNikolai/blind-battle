version: '3'

vars:
  COMPOSE: docker compose -f deploy/docker-compose.yaml # backend + frontend + angie + redis + postgres
  COMPOSE_DEV: docker compose -f deploy/docker-compose.dev.yaml # redis + postgres
  COMPOSE_PRDO: docker compose -f deploy/docker-compose.prod.yaml # backend + frontend + angie + redis + postgres + grafana + loki

tasks:
  default:
    silent: true
    cmds:
      - task --list

  up:
    desc: Собрать и запустить всё (dev, HTTP)
    cmds:
      - '{{.COMPOSE}} up -d --build'

  up:prod:
    desc: Собрать и запустить в режиме prod (HTTPS, ACME)
    env:
      ANGIE_SITE: prod
    cmds:
      - '{{.COMPOSE}} up -d --build'

  down:
    desc: Остановить контейнеры (данные остаются)
    cmds:
      - '{{.COMPOSE}} down'

  clean:
    desc: Остановить и удалить тома (БД, Redis, сертификаты будут потеряны)
    prompt: Удалить все данные? Это необратимо
    cmds:
      - '{{.COMPOSE}} down -v'

  build:
    desc: 'Пересобрать образы: task build -- backend'
    cmds:
      - '{{.COMPOSE}} build {{.CLI_ARGS}}'

  restart:
    desc: 'Перезапустить сервис: task restart -- backend'
    cmds:
      - '{{.COMPOSE}} restart {{.CLI_ARGS}}'

  ps:
    desc: Статус и healthcheck сервисов
    cmds:
      - '{{.COMPOSE}} ps'

  logs:
    desc: 'Логи: task logs -- angie'
    cmds:
      - '{{.COMPOSE}} logs -f --tail=100 {{.CLI_ARGS}}'

  config:
    desc: Проверить compose-файл и подстановку переменных
    cmds:
      - '{{.COMPOSE}} config'

  angie:check:
    desc: Проверить конфиг Angie (angie -t) без запуска сервера
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps angie angie -t'

  angie:reload:
    desc: Перечитать конфиг Angie без простоя
    cmds:
      - '{{.COMPOSE}} exec angie angie -s reload'

  db:psql:
    desc: psql внутри контейнера Postgres
    interactive: true
    cmds:
      - "{{.COMPOSE}} exec postgres sh -c 'psql -U $POSTGRES_USER -d $POSTGRES_DB'"

  db:apply:
    desc: 'Применить SQL-файл: task db:apply -- backend/db/init/04-solo-and-cleanup.sql'
    cmds:
      - "{{.COMPOSE}} exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U $POSTGRES_USER -d $POSTGRES_DB' < {{.CLI_ARGS}}"
