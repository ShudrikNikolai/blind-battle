location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# вход админа: не чаще ~5 попыток в минуту с одного IP
location = /api/admin/login {
    limit_req zone=login burst=5 nodelay;
    include /etc/angie/snippets/proxy.conf;
    proxy_pass http://backend;
    error_page 502 503 504 = @api_unavailable;
}

location /api/ {
    limit_req zone=api burst=40 nodelay;
    include /etc/angie/snippets/proxy.conf;
    proxy_pass http://backend;                         # без URI: путь /api/... уходит как есть
    error_page 502 503 504 = @api_unavailable;
}

location @api_unavailable {
    default_type application/json;
    return 503 '{"status":503,"errors":{"message":"Service unavailable","details":[]}}';
}

location / {
    include /etc/angie/snippets/proxy.conf;
    proxy_pass http://frontend;
}
