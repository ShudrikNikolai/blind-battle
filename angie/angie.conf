user angie;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/angie/mime.types;
    default_type application/octet-stream;

    log_format json escape=json
      '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
      '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
      '"rt":$request_time,"urt":"$upstream_response_time","host":"$host","ua":"$http_user_agent"}';
    access_log /dev/stdout json;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;


    resolver 127.0.0.11 valid=10s ipv6=off;

    # защита от перебора и флуда
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
    limit_req_status 429;

    upstream backend {
        zone backend 1m;
        server backend:3000 resolve;
        keepalive 16;
    }

    upstream frontend {
        zone frontend 1m;
        server frontend:3000 resolve;
        keepalive 16;
    }

    include /etc/angie/sites/*.conf;
}
